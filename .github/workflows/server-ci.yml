name: Server CI

on:
  push:
    paths:
      - 'server/story-agent/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/story-agent/**'
      - '.github/workflows/server-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/story-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/story-agent/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
